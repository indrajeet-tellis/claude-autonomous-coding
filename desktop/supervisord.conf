[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# ============================================================================
# VNC Server
# ============================================================================
[program:vnc]
command=/usr/bin/vncserver :1 -geometry %(ENV_VNC_RESOLUTION)s -depth %(ENV_VNC_COL_DEPTH)s -localhost no -SecurityTypes None --I-KNOW-THIS-IS-INSECURE -fg
user=agent
environment=HOME="/home/agent",USER="agent",DISPLAY=":1"
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc-error.log

# ============================================================================
# noVNC (Web-based VNC client)
# ============================================================================
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5901
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc-error.log

# ============================================================================
# Agent Process (optional - can be started via API)
# ============================================================================
[program:agent]
command=/usr/bin/python3 /app/agent/agent.py
directory=/workspace
user=agent
environment=HOME="/home/agent",USER="agent",DISPLAY=":1",WORKSPACE="/workspace"
autostart=false
autorestart=false
priority=30
stdout_logfile=/var/log/supervisor/agent.log
stderr_logfile=/var/log/supervisor/agent-error.log

# ============================================================================
# Agent Control Watcher (monitors .agent_control for start/stop commands)
# ============================================================================
[program:watcher]
command=/usr/bin/python3 /app/agent/watcher.py
directory=/workspace
user=root
environment=WORKSPACE="/workspace",DISPLAY=":1",PYTHONUNBUFFERED=1
autostart=true
autorestart=true
priority=25
stdout_logfile=/var/log/supervisor/watcher.log
stderr_logfile=/var/log/supervisor/watcher-error.log
