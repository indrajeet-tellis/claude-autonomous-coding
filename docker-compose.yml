services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: agent-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentpass}
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # FastAPI Backend
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agentpass}@postgres:5432/${POSTGRES_DB:-agent_db}
      - API_SECRET_KEY=${API_SECRET_KEY:-super-secret-key-change-me}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DESKTOP_HOST=desktop
    volumes:
      - ./workspace:/workspace
      - ./screenshots:/app/screenshots
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Next.js Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_VNC_URL=http://localhost:6080/vnc.html
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ============================================================================
  # Desktop (VNC + Agent with Claude Agent SDK)
  # ============================================================================
  desktop:
    build:
      context: .
      dockerfile: desktop/Dockerfile
    container_name: agent-desktop
    environment:
      # VNC
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - VNC_COL_DEPTH=24
      - VNC_PASSWORD=${VNC_PASSWORD:-agentpass}
      # Claude Agent SDK with MiniMax
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.minimax.io/anthropic}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-${ANTHROPIC_AUTH_TOKEN}}
      - API_TIMEOUT_MS=${API_TIMEOUT_MS:-3000000}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-MiniMax-M2}
      - ANTHROPIC_SMALL_FAST_MODEL=${ANTHROPIC_SMALL_FAST_MODEL:-MiniMax-M2}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL:-MiniMax-M2}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL:-MiniMax-M2}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL:-MiniMax-M2}
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
      # Agent
      - AGENT_HEADLESS=${AGENT_HEADLESS:-false}
      - WORKSPACE=/workspace
      - API_URL=http://backend:8000
    volumes:
      - ./workspace:/workspace
      - ./screenshots:/app/screenshots
    ports:
      # VNC (direct)
      - "5901:5901"
      # noVNC (web)
      - "6080:6080"
      # Agent-built apps
      - "3002:3000"
      - "5005:5000"
      - "8088:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
